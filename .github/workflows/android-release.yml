name: Build and publish AnimeWeek Android update

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version name for a test build (for example 95.28.0)
        required: true
        default: '95.28.0'
        type: string

permissions:
  contents: write

concurrency:
  group: animeweek-android-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          if [[ ! "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Version must follow semantic versioning, e.g. 95.28.0" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          VERSION_CODE=$((MAJOR * 100000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE > 2100000000 )); then
            echo "Android versionCode is above the supported maximum." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Install web dependencies and sync Capacitor
        run: |
          npm ci
          npm run test:all
          npx cap sync android
          chmod +x android/gradlew

      - name: Configure and inspect signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/animeweek-debug.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/keystore-info.txt"
          EXPECTED_CERT="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/keystore-info.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$EXPECTED_CERT" ]; then
            echo "Could not read SHA-256 fingerprint from configured keystore." >&2
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "expected_cert=$EXPECTED_CERT" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AW_VERSION_NAME: ${{ steps.version.outputs.version }}
          AW_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify package, version and signing certificate
        id: verify
        env:
          EXPECTED_CERT: ${{ steps.signing.outputs.expected_cert }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -s "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          APP_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          CERT="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$APP_ID" = "com.animeweek.tracker" || { echo "Unexpected applicationId: $APP_ID" >&2; exit 1; }
          test "$VERSION_NAME" = "$EXPECTED_VERSION" || { echo "Unexpected versionName: $VERSION_NAME" >&2; exit 1; }
          test "$VERSION_CODE" = "$EXPECTED_VERSION_CODE" || { echo "Unexpected versionCode: $VERSION_CODE" >&2; exit 1; }
          test -n "$CERT" && test "$CERT" = "$EXPECTED_CERT" || { echo "APK signer does not match the configured debug keystore." >&2; exit 1; }
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload test APK artifact (manual build only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWeek-Tracker-${{ steps.version.outputs.version }}-signed-test-apk
          path: ${{ steps.verify.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK="${{ steps.verify.outputs.apk }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#AnimeWeek-Tracker-$VERSION.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK#AnimeWeek-Tracker-$VERSION.apk" --title "AnimeWeek Tracker $VERSION" --generate-notes --target main --repo "$GITHUB_REPOSITORY"
          fi

      - name: Update latest.json on main
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          APK_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/AnimeWeek-Tracker-${{ steps.version.outputs.version }}.apk
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create main origin/main
          python - <<'PY'
          import json, os
          version = os.environ['VERSION']
          version_code = int(os.environ['VERSION_CODE'])
          manifest = {
            'appId': 'com.animeweek.tracker',
            'appName': 'AnimeWeek Tracker',
            'version': version,
            'versionCode': version_code,
            'channel': 'stable',
            'publishedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
            'releaseName': 'AnimeWeek Tracker ' + version,
            'releaseNotes': 'Actualización Android verificada y firmada. Consulta GitHub Releases para los detalles.',
            'releaseUrl': os.environ['RELEASE_URL'],
            'minimumSupportedVersion': '95.28.0',
            'web': {'enabled': False, 'version': version, 'url': '', 'sha256': ''},
            'android': {
              'enabled': True,
              'versionCode': version_code,
              'apkUrl': os.environ['APK_URL'],
              'sha256': os.environ['APK_SHA256'],
              'packageName': 'com.animeweek.tracker',
              'signingRequired': True,
              'notes': 'APK verificada contra el certificado del keystore configurado.'
            }
          }
          with open('latest.json', 'w', encoding='utf-8') as f:
            json.dump(manifest, f, ensure_ascii=False, indent=2)
            f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish AnimeWeek update manifest $VERSION"
          git push origin main
