name: AnimeWeek development validation

on:
  push:
    branches:
      - feature/agenda-management-rebuild
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animeweek-dev-validation-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run all regression tests
        run: npm run test:all

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Sync Capacitor Android project
        run: |
          npx cap sync android
          chmod +x android/gradlew

      - name: Build unsigned debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWeek-Tracker-development-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
